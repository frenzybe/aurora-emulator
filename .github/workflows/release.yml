name: Build and Release
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            os: macos
            arch: aarch64
            triple: aarch64-apple-darwin
          - platform: macos-latest
            os: macos
            arch: x86_64
            triple: x86_64-apple-darwin
          - platform: windows-latest
            os: windows
            arch: x86_64
            triple: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # 1. Install Dependencies
      - name: Install dependencies (macOS)
        if: matrix.os == 'macos'
        run: |
          brew install sdl2 sdl2_image sdl2_ttf openssl cmake
      
      - name: Install dependencies (Windows)
        if: matrix.os == 'windows'
        run: |
          vcpkg install sdl2:x64-windows-static sdl2-image:x64-windows-static sdl2-ttf:x64-windows-static openssl:x64-windows-static

      # 2. Build Emulator Core (C++)
      - name: Build Core
        run: |
          mkdir build
          cd build
          if [ "${{ matrix.os }}" = "windows" ]; then
            cmake .. -A x64 -DVCPKG_TARGET_TRIPLET=x64-windows-static -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
            cmake --build . --config Release
          else
            cmake .. -DCMAKE_BUILD_TYPE=Release
            make -j$(sysctl -n hw.ncpu)
          fi
        shell: bash

      # 3. Setup Tauri Sidecar
      - name: Setup Sidecar
        run: |
          mkdir -p aurora-ui/src-tauri/binaries
          if [ "${{ matrix.os }}" = "windows" ]; then
            cp build/Release/MegaDriveEmu.exe aurora-ui/src-tauri/binaries/MegaDriveEmu-${{ matrix.triple }}.exe
          else
            cp build/MegaDriveEmu aurora-ui/src-tauri/binaries/MegaDriveEmu-${{ matrix.triple }}
          fi
        shell: bash

      # 4. Build Tauri App
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install app dependencies and build
        run: |
          cd aurora-ui
          npm install
          npm run tauri build

      # 5. Upload Artifacts
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aurora-${{ matrix.triple }}
          path: |
            aurora-ui/src-tauri/target/release/bundle/dmg/*.dmg
            aurora-ui/src-tauri/target/release/bundle/msi/*.msi
            aurora-ui/src-tauri/target/release/bundle/nsis/*.exe
