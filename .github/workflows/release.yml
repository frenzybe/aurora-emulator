name: Release
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos-latest'
        run: brew install sdl2 sdl2_ttf sdl2_image

      - name: Install dependencies (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          vcpkg install sdl2:x64-windows sdl2-ttf:x64-windows sdl2-image:x64-windows
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> $GITHUB_ENV

      - name: Build Emulator (C++)
        shell: bash
        run: |
          mkdir -p build
          cd build
          if [ "${{ matrix.platform }}" == "windows-latest" ]; then
            cmake .. -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
          else
            cmake ..
          fi
          cmake --build . --config Release
          
      - name: Prepare Sidecars
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" == "macos-latest" ]; then
            TRIPLE="aarch64-apple-darwin"
            EXT=""
            SRC="build/MegaDriveEmu"
          else
            TRIPLE="x86_64-pc-windows-msvc"
            EXT=".exe"
            SRC="build/Release/MegaDriveEmu.exe"
          fi
          
          mkdir -p aurora-ui/src-tauri/binaries
          cp $SRC aurora-ui/src-tauri/binaries/MegaDriveEmu-${TRIPLE}${EXT}

      - name: Install Frontend Deps
        run: |
          cd aurora-ui
          npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: aurora-ui
          tagName: aurora-v__VERSION__
          releaseName: "Aurora v__VERSION__"
          releaseBody: "Automated cross-platform build for macOS and Windows."
          releaseDraft: true
          prerelease: false
