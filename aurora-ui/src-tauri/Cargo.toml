[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.0", features = ["macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
reqwest = { version = "0.12", features = ["json", "cookies", "stream"] }
tokio = { version = "1", features = ["full"] }
urlencoding = "2.1"
base64 = "0.22"
futures = "0.3"
regex = "1.10"
zip = "2.2"
md5 = "0.8.0"
once_cell = "1.21.4"
rusqlite = { version = "0.39.0", features = ["bundled"] }
chrono = "0.4.44"
encoding_rs = "0.8.34"
gilrs = "0.10"
